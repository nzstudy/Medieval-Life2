const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)],C=(v,a=0,b=100)=>Math.max(a,Math.min(b,Math.round(v)));
const MN=['Aldric','Bram','Cedric','Doran','Edmund','Godric','Hugh','Ivor','Leofric','Osric','Roland','Tomas','Wulf','Alaric'],FN=['Adela','Brida','Cecily','Edda','Elswyth','Hilda','Isolde','Maud','Rowena','Sigrid','Tilde','Wynne','Alys','Eleanor'],SN=['Ashford','Blackmere','Caldwell','Dunmore','Eastwick','Fairholt','Greymoor','Holloway','Ironwood','Kestrel','Marlowe','Northcote','Oakhart','Ravenscar','Stormvale','Thornfield'],TR=['Corajoso','Tímido','Ambicioso','Piedoso','Astuto','Generoso','Invejoso','Leal','Cruel','Alegre'],PL=['Brookvale','Hollowmere','Stonebridge','Wolfsden','Pinecrest','Saltmarsh'];

const LV=[120,200,200,500,900,700,2500,6000,20000],RT=[0,0,0,0,0,0,4000,9000,50000];

const SC={Leitura:[200,6],Matemática:[300,8],História:[200,8],Religião:[100,6],Medicina:[600,12],Estratégia:[800,14],Idiomas:[500,10],Etiqueta:[400,8],Combate:[300,7],Ofício:[150,10]};
const IT={roupa:['Roupas finas',300,'g',0,0],adaga:['Adaga',150,'w',0,4],lanca:['Lança',500,'w',0,9],arco:['Arco longo',500,'w',0,9],machado:['Machado',600,'w',0,10],martelo:['Martelo de guerra',700,'w',0,10],espada:['Espada',800,'w',0,12],besta:['Besta',900,'w',0,11],escudo:['Escudo',400,'a',0,5],elmo:['Elmo',500,'a',0,4],couro:['Armadura de couro',600,'a',0,8],cota:['Cota de malha',3000,'a',0,16],placas:['Armadura de placas',15000,'a',0,26],cavalo:['Cavalo',4000,'h',0,8],casa:['Casa',20000,'p',0,0],terreno:['Terreno',15000,'p',800,0],fazenda:['Fazenda',40000,'p',2800,0],oficina:['Oficina',30000,'p',2200,0],taverna:['Taverna',50000,'p',4000,0],barco:['Embarcação',60000,'p',5000,0]};
let p=null,W=null,tab='v',sel=0;
const M=n=>{n=Math.round(n);const o=Math.floor(n/10000),s=Math.floor(n/100)%100,c=n%100;return[o&&o+' ouro',s&&s+' prata',(c||!n)&&c+' cobre'].filter(Boolean).join(' ')};
const K=()=>W.k[p.k],stage=a=>a<4?'primeira infância':a<8?'infância':a<13?'infância avançada':a<18?'adolescência':a<30?'juventude':a<50?'maturidade':a<65?'meia-idade':'velhice';

const st=(k,d)=>{p[k]=C(p[k]+d)},pay=c=>p.money>=c?(p.money-=c,true):false,gain=c=>{p.money+=Math.round(c)};

function die(c){p.alive=0;p.cause=c;p.dage=p.age}

function jobOf(c){const t=P(CL[c][3]);return T[t][R(0,Math.min(2,T[t].length-1))][0]}
function newWorld(){W={y:1187,id:0,plague:-1,pyr:0,famine:-1,fyr:0,news:[],anc:[],k:KD.map(d=>({n:d[0],cap:d[1],rl:d[2],ruler:{n:P(MN),dyn:P(SN),age:R(30,60)},wealth:R(40,70),army:R(30,70),stab:R(50,80),tax:1,war:-1,law:R(1,3)}))}}
function born(cl,h){
 const tier=CL[cl][1],sex=h?h.ch.sex:P(['M','F']),k=h?h.par.k:R(0,3),sn=h?h.par.sn:P(SN);
 p={alive:1,cl,tier,sex,k,sn,n:h?h.ch.n:P(sex=='M'?MN:FN)+' '+sn,age:h?h.ch.age:0,gen:h?h.par.gen+1:1,place:tier>=4?W.k[k].cap:P(PL),fam:[],log:[],inv:h?h.par.inv:[],debt:h?h.par.debt:0,money:0,job:null,spouse:0,jail:0,crimes:0,sc:[],ill:null,ap:2,pend:null,king:0,sk:{}};
 ST.forEach(s=>p[s[0]]=R(30,70)+(['rep','hon','inf','fe','fel'].includes(s[0])?0:tier*2));p.sau=R(55,90);p.rep=tier*5;p.hon=R(30,60);p.inf=0;p.bel=R(20,90);
 p.tr=[P(TR),P(TR)];p.talent=P(Object.keys(SC));Object.keys(SC).forEach(s=>p.sk[s]=0);p.sk[p.talent]=15;
 if(h){p.money=Math.round(h.par.money*.7);p.fam.push({...mkP(h.par,'Pai','Mãe'),alive:0});const sp=h.par.fam.find(x=>x.alive&&x.rel=='Cônjuge');if(sp)p.fam.push({...sp,rel:sp.sex=='M'?'Pai':'Mãe',aff:60});
  h.par.fam.filter(x=>x.alive&&/^Filh/.test(x.rel)&&x.id!=h.ch.id).forEach(x=>p.fam.push({...x,rel:x.sex=='M'?'Irmão':'Irmã'}));
  h.par.fam.filter(x=>x.alive&&(x.rel=='Rival'||(x.rel=='Amigo'&&x.aff>65))).slice(0,5).forEach(x=>p.fam.push({...x,aff:x.rel=='Rival'?10:55,mem:[x.rel=='Rival'?'Rival herdado de seu pai/mãe.':'Aliado de sua família.']}));
  W.anc.push(h.par.n+' ('+h.par.age+')');log('Você assumiu o legado de '+h.par.n+'. Propriedades, rivalidades e alianças passaram para você.','good');
  if(h.par.king){p.cl=h.par.cl}
 }else{p.money=Math.round(CL[cl][2]*R(5,15)/10*.2);
  const f=mp('Pai','M',R(18,35),sn),m=mp('Mãe','F',R(18,35),sn);f.job=jobOf(cl);m.job=tier>=3?'Dama':'Lar';p.fam.push(f,m);
  for(let i=R(0,3);i--;){const s=P(['M','F']);p.fam.push(mp(s=='M'?'Irmão':'Irmã',s,R(0,12),sn))}
  if(tier==5){W.k[k].ruler={n:f.n.split(' ')[0],dyn:sn,age:f.age+R(10,25),pid:f.id};f.age=W.k[k].ruler.age;f.job='Rei';m.job='Rainha'}
  log(`Você nasceu em ${p.place}, ${W.k[k].n}, como ${CL[cl][0]}. Pais: ${f.n} e ${m.n}.`,'good')}
 if(h&&p.age>=16&&h.par.king)crown(p.k);else if(h&&h.par.king){W.k[p.k].ruler={n:'Regente '+P(MN),dyn:p.sn,age:R(30,50)};p.crownAt=16}
}
const mkP=(o,r1,r2)=>({id:++W.id,n:o.n,sex:o.sex,age:o.age,rel:o.sex=='M'?r1:r2,aff:70,alive:1,tr:o.tr[0],job:'',mem:['Seu predecessor na dinastia.'],dy:o.age});
function crown(i){p.king=1;p.job={t:'Reino',r:0,yrs:0,tot:0};W.k[i].ruler={n:p.n.split(' ')[0],dyn:p.sn,age:p.age,pid:'me'};st('rep',10);log(`Você foi coroado ${p.sex=='M'?'rei':'rainha'} de ${W.k[i].n}!`,'good')}
function pdie(x,c){x.alive=0;x.dy=p.age;x.mem.push('Morreu quando você tinha '+p.age+' anos.');log(`${x.rel} ${x.n} faleceu aos ${x.age} anos${c?' ('+c+')':''}.`,'bad');st('fel',-8);if(x.rel=='Cônjuge')p.spouse=0;if((x.rel=='Pai'||x.rel=='Mãe')&&p.age>=12){const o=fp('Pai')||fp('Mãe'),v=Math.round(CL[p.cl][2]*(o?.1:R(30,80)/100));gain(v);if(!o&&p.tier>=3&&!p.inv.includes('terreno'))p.inv.push('terreno');log('Herança recebida: '+M(v)+'.','good')}return x.rel+' '+x.n+' morreu.'}
function rel(r,d){const x=fp(r);if(x)x.aff=C(x.aff+d)}
function injure(s){st('sau',-s);if(Math.random()<.25){const o=P([['Cicatriz no rosto','bel',-6],['Perna aleijada','agi',-12],['Braço mal curado','for',-8],['Tosse crônica','res',-8]]);p.sc.push(o[0]);st(o[1],o[2]);log('Sequela permanente: '+o[0]+'.','bad');return' Sequela: '+o[0]+'.'}return''}
const gear=()=>Math.max(0,...p.inv.map(i=>IT[i][2]=='w'?IT[i][4]:0))+p.inv.reduce((s,i)=>s+(IT[i][2]=='a'||IT[i][2]=='h'?IT[i][4]:0),0);
const pw=()=>p.for*.35+p.agi*.25+p.cor*.2+p.sk.Combate*.4+gear()+R(0,25);
function addFriend(r){const s=P(['M','F']),x=mp(r||'Amigo',s,Math.max(5,p.age+R(-4,4)),P(SN));x.job=jobOf(P([0,1,2,3,4]));x.mem.push('Conheceram-se no ano '+W.y+'.');p.fam.push(x);return x}
function birth(){const s=P(['M','F']),c=mp(s=='M'?'Filho':'Filha',s,0,p.sex=='M'?p.sn:(fp('Cônjuge')||{n:' '+p.sn}).n.split(' ').pop());c.aff=80;p.fam.push(c);log(`Nasceu seu ${s=='M'?'filho':'filha'}, ${c.n}.`,'good');st('fel',8);if(p.sex=='F'&&Math.random()<.04){die('complicações do parto');}else if(p.sex=='M'){const sp=fp('Cônjuge');if(sp&&Math.random()<.04)pdie(sp,'parto')}return c}
function justice(sev){const k=K(),l=k.law;p.crimes++;st('rep',-8);st('hon',-10);st('inf',8);const r=Math.random();
 if(p.crimes>3&&Math.random()<.08*l*sev){die('executado por seus crimes');log('Você foi executado por seus crimes.','bad');return'Executado.'}
 if(r<.4){const f=Math.min(p.money,300*sev*l);p.money-=f;return'Multa de '+M(f)+'.'}
 if(r<.7){p.jail=R(1,Math.min(4,sev*l));st('sau',-5);return'Preso por '+p.jail+' ano(s).'}
 if(r<.85){const f=Math.floor(p.money/2);p.money-=f;if(p.inv.length)p.inv.pop();return'Confisco de bens ('+M(f)+').'}
 const nk=(p.k+R(1,3))%4;p.k=nk;p.inv=p.inv.filter(i=>IT[i][2]!='p');p.job=null;return'Exilado para '+W.k[nk].n+'; propriedades perdidas.'}
function income(){let r=[],m=Math.min(1.3,K().wealth/60)*(K().war>=0?.8:1)*(W.plague==p.k?.7:1)*(W.famine==p.k?.75:1);
 if(p.king)r.push(['Tesouro real',K().wealth*250*K().tax]);else if(p.job&&p.age<65)r.push(['Salário',T[p.job.t][p.job.r][1]*m]);
 if(RT[p.cl]&&!p.king)r.push(['Rendas de família',RT[p.cl]*m]);p.inv.forEach(i=>IT[i][3]&&r.push([IT[i][0],IT[i][3]*m]));return r}
const EV={
 pai:{w:5,ok:p=>p.age>3&&p.age<18&&fp('Pai'),t:()=>'Seu pai conseguiu um novo trabalho e a casa respira melhor.',r:p=>{st('fel',4);gain(100)}},
 mae:{w:5,ok:p=>p.age<35&&fp('Mãe'),t:()=>'Sua mãe ficou gravemente doente.',ch:[['Chamar curandeiro (1 prata)',p=>pay(100)?Math.random()<.6?(rel('Mãe',10),'Ela se recuperou.'):pdie(fp('Mãe'),'doença'):'Você não tem prata.'],['Rezar por ela',p=>{st('fe',3);return Math.random()<.4+p.fe/200?'Ela se recuperou.':pdie(fp('Mãe'),'doença')}],['Ignorar',p=>{rel('Mãe',-15);return'Ela sobreviveu, magoada.'}]]},
 negocio:{w:5,ok:p=>p.age>=16&&p.money>=1000,t:()=>'Um comerciante ofereceu um negócio: investir 10 prata em uma carga de tecidos.',ch:[['Investir',p=>{if(!pay(1000))return'Sem fundos.';if(Math.random()<.45+p.int/300){gain(2600);return'Lucro de 16 prata!'}st('fel',-3);return'A carga foi roubada. Prejuízo.'}],['Recusar',()=>'Você preferiu cautela.']]},
 bandido:{w:6,ok:p=>p.age>=8,t:()=>'Um bandido tentou roubar você na estrada.',ch:[['Lutar',p=>pw()>R(35,95)?(st('cor',3),st('rep',2),'Você o afugentou.'):'Você perdeu a luta. '+injure(R(8,20))],['Fugir',p=>Math.random()<.5+p.agi/200?'Escapou ileso.':(p.money=Math.floor(p.money/2),'Roubaram metade do seu dinheiro.')],['Pagar (1 prata)',p=>pay(100)?'Ele aceitou e se foi.':'Sem prata: levou o que tinha.']]},
 peste:{w:9,ok:p=>W.plague==p.k,t:()=>'Uma epidemia assola a região. As ruas estão vazias.',ch:[['Fugir para o campo (2 prata)',p=>pay(200)?(Math.random()<.2?(p.ill={n:'peste',y:2,s:15},'Adoeceu na fuga.'):'Escapou do contágio.'):'Sem dinheiro para fugir.'],['Cuidar dos doentes',p=>{st('hon',6);st('rep',4);if(Math.random()<.35){p.ill={n:'peste',y:2,s:15};return'Você se contagiou.'}return'Ajudou muitos e sobreviveu.'}],['Trancar-se em casa',p=>Math.random()<.25?(p.ill={n:'peste',y:2,s:15},'A peste entrou em sua casa.'):'A casa foi poupada.']]},
 noivado:{w:4,ok:p=>p.age>=16&&p.age<35&&!p.spouse&&p.tier>=2,i:p=>({x:mp('Pretendente',p.sex=='M'?'F':'M',p.age+R(-3,4),P(SN)),d:R(2,8)*500*(p.tier+1)}),t:(p,c)=>`${c.x.n}, de família influente, propõe casamento. Dote: ${M(c.d)}.`,ch:[['Aceitar',(p,c)=>{c.x.rel='Cônjuge';c.x.aff=60;p.fam.push(c.x);p.spouse=c.x.id;gain(c.d);st('fel',8);st('rep',3);return'Casaram-se. Aliança familiar selada.'}],['Recusar',p=>{st('rep',-2);return'A oferta foi recusada.'}]]},
 duelo:{w:4,ok:p=>p.age>=16&&p.tier>=3,i:()=>({n:P(MN)+' '+P(SN)}),t:(p,c)=>`Ser ${c.n} desafiou você para um duelo de honra.`,ch:[['Aceitar',(p,c)=>{const w=pw()>R(40,100);if(w){st('rep',8);st('hon',4);return'Você venceu o duelo!'}if(Math.random()<.15){die('morto em duelo');return'Você morreu no duelo.'}st('rep',-3);return'Derrotado. '+injure(R(10,25))}],['Recusar',()=>{st('hon',-8);st('rep',-5);return'Chamaram-no de covarde.'}],['Pagar compensação (5 prata)',()=>pay(500)?'O assunto foi encerrado.':'Sem prata.']]},
 ajuda:{w:5,ok:p=>p.age>=12,t:()=>'Um camponês pediu ajuda: a colheita dele apodreceu.',ch:[['Ajudar (2 prata)',p=>pay(200)?(st('hon',5),st('rep',3),'Ele jurou gratidão.'):'Sem prata.'],['Ignorar',()=>'Ele se afastou, cabisbaixo.'],['Cobrar por ajuda',p=>{gain(100);st('hon',-4);return'Você lucrou às custas dele.'}]]},
 irmao:{w:3,ok:p=>p.fam.some(x=>x.alive&&/^Irm/.test(x.rel)),t:()=>'Seu irmão ou irmã desapareceu.',ch:[['Procurar (5 prata)',p=>pay(500)?Math.random()<.55||!p.fam.some(x=>x.alive&&/^Irm/.test(x.rel))?'Foi encontrado(a) são e salvo.':pdie(p.fam.find(x=>x.alive&&/^Irm/.test(x.rel)),'desaparecido'):'Sem prata.'],['Esperar',p=>{const x=p.fam.find(x=>x.alive&&/^Irm/.test(x.rel));if(!x)return'Nada mais a fazer.';if(Math.random()<.5)return'Voltou depois de semanas.';x.aff=C(x.aff-20);return'Voltou, ressentido(a) pela sua inércia.'}]]},

 if(a=='inv'){if(!pay(5000))return;k.wealth=C(k.wealth+5);st('rep',2);t='Você investiu no reino.'}
 if(a=='war'){if(j==p.k||k.war>=0||W.k[j].war>=0)return;k.war=j;W.k[j].war=p.k;news(`${k.n} (você) declarou guerra a ${W.k[j].n}.`);t='Você declarou guerra a '+W.k[j].n+'.'}
 if(a=='peace'){if(k.war<0)return;if(Math.random()<.55){W.k[k.war].war=-1;k.war=-1;t='Paz alcançada.'}else t='O inimigo recusou a paz.'}
 if(a=='plot'||a=='rebel'){if(a=='rebel'&&!pay(10000))return;const ch=.05+(100-k.stab)/250+(a=='rebel'?.08:0)+(p.tier>=3?.05:0);if(Math.random()<ch){if(p.tier>=3){k.stab=C(k.stab-30);crown(p.k);t='Golpe bem-sucedido!'}else{k.stab=C(k.stab-20);st('rep',10);t='A rebelião derrubou o rei, mas outro assumiu o trono.';k.ruler={n:P(MN),dyn:P(SN),age:R(25,45)}}}else t='Fracassou. '+justice(3)}
 p.ap--;log(t);save();render()}
function save(){try{localStorage.setItem('ml1',JSON.stringify({p,W}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('ml1'));if(s&&s.p){p=s.p;W=s.W;tab='v';render()}}catch(e){}}
function nova(c){if(!W||c===-2)newWorld();if(c<0||c===undefined){let t=Math.random()*100;c=0;for(;c<8&&(t-=CW[c])>=0;c++);}born(c);save();tab='v';render()}
function heir(id){const ch=p.fam.find(x=>x.id==id),old=p;born(old.cl,{ch,par:old});tab='v';save();render()}
const bar=(l,v,c)=>`<div class=mu>${l} ${v}</div><div class=bar><i style="width:${v}%${c?';background:'+c:''}"></i></div>`;
function head(){const k=K();return`<div class=pn><h2>${p.king?'👑 ':''}${p.n} <span class=mu>· ${p.age} anos</span></h2><div class=mu>${CL[p.cl][0]}${p.job?' · '+T[p.job.t][p.job.r][0]:''} · ${stage(p.age)} · ${k.n} · ano ${W.y}${p.gen>1?' · geração '+p.gen:''}</div><div class=mu>${M(p.money)}${p.debt?' · dívida '+M(p.debt):''} · ações: ${p.ap}</div><div class=g>${bar('Saúde',p.sau,'var(--rd)')}${bar('Felicidade',p.fel)}</div>${p.ill?`<div class=bad>Doente: ${p.ill.n}</div>`:''}${p.jail?`<div class=bad>Preso (${p.jail} ano(s))</div>`:''}</div>`}
function view(){const k=K();
 if(tab=='v'){if(p.pend){const e=EV[p.pend.id];return`<div class=pn><h3>${e.t(p,p.pend.c)}</h3>${e.ch.map((c,i)=>`<button style="width:100%;text-align:left" onclick="choose(${i})">${c[0]}</button>`).join('')}</div>`}
  return`<button class=big onclick="year()">VIVER MAIS UM ANO</button><div class=pn>${p.log.slice(0,12).map(l=>`<div class="lg ${l.c}"><span class=mu>${l.a} anos</span> ${l.t}</div>`).join('')}</div>`}
 if(tab=='p')return`<div class=pn><h3>Atributos</h3><div class=g>${ST.map(s=>bar(s[1],p[s[0]],s[0]=='inf'?'var(--rd)':'')).join('')}</div><p>Personalidade: ${p.tr.join(', ')}<br>Talento natural: ${p.talent}<br>Crença: ${k.rl}<br>${p.sc.length?'Sequelas: '+p.sc.join(', '):'Sem sequelas'}</p></div>`;
 if(tab=='f'){const l=p.fam,x=l.find(y=>y.id==sel);let h='';if(x&&x.alive){const a=(f,t)=>`<button onclick="pact(${x.id},'${f}')">${t}</button>`,fm=/^(Pai|Mãe|Irm|Filh)/.test(x.rel);h=`<div class=pn><h3>${x.n}</h3><div class=mu>${x.rel}, ${x.age} anos${x.job?', '+x.job:''} · ${x.tr}</div>${bar('Afeto',x.aff)}<div class=mu>${x.mem.slice(-3).join(' ')}</div>${a('talk','Conversar')}${a('gift','Presentear (1 prata)')}${a('fight','Discutir')}${a('ask','Pedir ajuda')}${!fm&&p.age>=16&&!/Cônj|Namor|Ex/.test(x.rel)&&x.age>=16?a('court','Cortejar'):''}${x.rel=='Namorado'&&!p.spouse&&x.aff>=60?a('marry','Casar'):''}${x.rel=='Cônjuge'?a('divorce','Divorciar-se'):''}${x.rel=='Rival'?a('duel','Desafiar para duelo')+a('forgive','Perdoar'):''}</div>`}
  return h+`<div class=pn><h3>Pessoas e árvore genealógica</h3>${l.map(y=>`<div class=lg style="${y.alive?'':'opacity:.55'}" onclick="sel=${y.id};render()"><b>${y.n}</b> <span class=mu>${y.rel}, ${y.alive?y.age+' anos · afeto '+y.aff:'† aos '+y.age}</span></div>`).join('')}</div>`}
 if(tab=='e')return`<div class=pn><h3>Estudos</h3><p class=mu>${p.age<6?'Disponível a partir dos 6 anos.':'Nobres pagam menos por tutores particulares.'}</p>${SK.map(s=>`<div class=lg>${s}: <b>${p.sk[s]}</b> <button ${p.age<SC[s][1]||p.ap<1||p.money<SC[s][0]*(p.tier>=3?.3:1)?'disabled':''} onclick="study('${s}')">Estudar (${M(Math.round(SC[s][0]*(p.tier>=3?.3:1)))})</button></div>`).join('')}</div>`;
 if(tab=='t'){const j=p.job;return`<div class=pn><h3>Profissão</h3>${j?`<p>${T[j.t][j.r][0]} (${j.t}) · ${j.tot} anos · salário ${M(T[j.t][j.r][1])}/ano</p>${T[j.t][j.r+1]?`<p class=mu>Próximo: ${T[j.t][j.r+1][0]} com ${T[j.t][j.r+1][2]} anos</p>`:''}${p.king?'':'<button onclick="quit()">Abandonar profissão</button>'}`:'<p class=mu>Sem profissão.</p>'}${p.age<14?'<p class=mu>Disponível a partir dos 14 anos.</p>':CL[p.cl][3].map(t=>`<div class=lg><b>${t}</b> <span class=mu>começa como ${T[t][0][0]}, chega a ${T[t][T[t].length-1][0]}</span><br><button ${p.job?'disabled':''} onclick="join('${t}')">Ingressar</button></div>`).join('')}</div>`}
 if(tab=='a')return`<div class=pn><h3>Atividades</h3><p class=mu>Você tem ${p.ap} ação(ões) neste ano.</p>${AC.map((a,i)=>p.age>=a[1]?`<button ${p.ap<1||p.jail||p.money<a[2]?'disabled':''} onclick="act(${i})">${a[0]}</button>`:'').join('')}</div>`;
 if(tab=='b')return`<div class=pn><h3>Bens</h3><p>${M(p.money)}${p.debt?` · dívida ${M(p.debt)}`:''}<br><span class=mu>100 cobre = 1 prata · 100 prata = 1 ouro</span></p><button onclick="loan()">Empréstimo 50 prata</button><button ${p.debt?'':'disabled'} onclick="repay()">Quitar dívida</button><p class=mu>Renda anual: ${income().map(x=>x[0]+' '+M(x[1])).join(', ')||'nenhuma'}. Imposto: ${Math.round(10*k.tax)}%.</p>${p.inv.map(i=>`<div class=lg>${IT[i][0]} <button onclick="sell('${i}')">Vender</button></div>`).join('')||'<p class=mu>Inventário vazio.</p>'}</div><div class=pn><h3>Comprar</h3>${Object.keys(IT).map(i=>`<button ${p.money<IT[i][1]||p.jail?'disabled':''} onclick="buy('${i}')">${IT[i][0]} · ${M(IT[i][1])}</button>`).join('')}</div>`;
 if(tab=='r')return`<div class=pn><h3>${k.n}</h3><p class=mu>Capital ${k.cap} · ${k.rl} · Governante: ${k.ruler.n} ${k.ruler.dyn}${k.war>=0?' · EM GUERRA com '+W.k[k.war].n:''}${W.plague==p.k?' · PESTE':''}${W.famine==p.k?' · FOME':''}</p>${bar('Riqueza',k.wealth)}${bar('Exército',k.army)}${bar('Estabilidade',k.stab)}<p class=mu>Impostos ×${k.tax} · Lei ${['branda','moderada','severa'][k.law-1]}</p>${p.king?`<button onclick="pol('up')">Subir impostos</button><button onclick="pol('down')">Baixar impostos</button><button onclick="pol('army')">Recrutar (50 prata)</button><button onclick="pol('inv')">Investir (50 prata)</button>${k.war>=0?'<button onclick="pol(\'peace\')">Propor paz</button>':W.k.map((o,j)=>j!=p.k?`<button onclick="pol('war',${j})">Guerra: ${o.n}</button>`:'').join('')}`:p.age>=18?`<button onclick="pol('plot')">Conspirar pelo trono</button><button onclick="pol('rebel')">Financiar rebelião (1 ouro)</button>`:''}</div><div class=pn><h3>Mundo</h3>${W.k.map(o=>`<div class=lg><b>${o.n}</b> ${o.ruler.n} ${o.ruler.dyn} · riqueza ${o.wealth} · exército ${o.army}${o.war>=0?' · guerra':''}</div>`).join('')}<p>${W.news.slice(0,8).map(n=>'<div class="lg mu">'+n+'</div>').join('')}</p></div>`;
 if(tab=='h')return`<div class=pn><h3>Histórico</h3>${p.log.map(l=>`<div class="lg ${l.c}"><span class=mu>${l.y} · ${l.a}a</span> ${l.t}</div>`).join('')}<button onclick="if(confirm('Apagar tudo e recomeçar?')){W=null;p=null;localStorage.removeItem('ml1');render()}">Novo mundo</button></div>`}
const TABS=[['v','Vida'],['p','Pessoa'],['f','Pessoas'],['e','Estudo'],['t','Trabalho'],['a','Atividades'],['b','Bens'],['r','Reino'],['h','Histórico']];
function startUI(){let s='';try{s=localStorage.getItem('ml1')}catch(e){}return`<h1>MEDIEVAL LIFE</h1><p>Nasça em um mundo de reis, pestes e guerras. Cada ano traz escolhas, e cada escolha deixa marcas.</p>${s?'<button class=big onclick="load()">Continuar vida salva</button>':''}<button class=big style="margin-top:8px" onclick="nova(-1)">Vida aleatória</button><div class=pn><h3>Ou escolha a origem</h3>${CL.map((c,i)=>`<button onclick="nova(${i})">${c[0]}</button>`).join('')}</div>`}
function legacy(){const ch=p.fam.filter(x=>x.alive&&/^Filh/.test(x.rel)),sib=p.fam.filter(x=>x.alive&&/^Irm/.test(x.rel)),desc=p.fam.filter(x=>/^Filh/.test(x.rel)).length,f=p.money-p.debt+p.inv.reduce((s,i)=>s+IT[i][1]*.7,0);
 return`<div class=pn><h2>${p.n} faleceu aos ${p.dage} anos</h2><p>Causa: ${p.cause}.<br>Fortuna: ${M(Math.max(0,f))}<br>Títulos: ${CL[p.cl][0]}${p.job?', '+T[p.job.t][p.job.r][0]:''}${p.king?', Rei de '+K().n:''}<br>Terras e bens: ${p.inv.map(i=>IT[i][0]).join(', ')||'nenhum'}<br>Filhos: ${desc} · Reputação ${p.rep} · Honra ${p.hon} · Infâmia ${p.inf}</p><p class=mu>${p.king?'Governou '+K().n+' e entrou para os anais do reino.':f>100000?'Deixou uma fortuna notável.':p.rep>60?'Foi lembrado com respeito.':'Viveu e morreu sem grande reconhecimento, como a maioria.'}</p><h3>Maiores acontecimentos</h3>${p.log.filter(l=>l.c).slice(0,6).map(l=>`<div class="lg ${l.c}">${l.a}a: ${l.t}</div>`).join('')}</div><div class=pn><h3>Continuar a dinastia</h3>${ch.concat(sib).map(x=>`<button onclick="heir(${x.id})">${x.n} (${x.age})</button>`).join('')||'<p class=mu>Sem herdeiros.</p>'}<button onclick="nova(-1)">Nova vida (mesmo mundo)</button><button onclick="W=null;p=null;render()">Menu</button></div>`}
function render(){const a=document.getElementById('app');if(!p)return a.innerHTML=startUI();if(!p.alive)return a.innerHTML=legacy();a.innerHTML=head()+view()+'<nav>'+TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')+'</nav>'}
document.addEventListener('keydown',e=>{if(!p||!p.alive||e.ctrlKey||e.metaKey||e.altKey)return;const n=+e.key;if(n>=1&&n<=9){if(p.pend){if(EV[p.pend.id].ch[n-1])choose(n-1)}else{tab=TABS[n-1][0];render()}}else if((e.key=='Enter'||e.key==' ')&&tab=='v'&&!p.pend&&e.target.tagName!='BUTTON'){e.preventDefault();year()}});
render();
</script></body></html>
